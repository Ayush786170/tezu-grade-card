<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#7a1f2b" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1416" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <title>Tezpur University Grade Card Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap');

    :root {
      color-scheme: light dark;
      --page: #f3f2f8;
      --page-deep: #e8e7f1;
      --surface: rgba(255, 255, 255, 0.66);
      --surface-strong: rgba(255, 255, 255, 0.88);
      --ink: #171629;
      --muted: #5d5a72;
      --line: rgba(57, 49, 91, 0.16);
      --line-strong: rgba(57, 49, 91, 0.27);
      --violet: #7657d6;
      --teal: #0e9b94;
      --magenta: #d9467d;
      --amber: #e4a33b;
      --button-start: #7052d7;
      --button-end: #b93c83;
      --button-hover-start: #6144c5;
      --button-hover-end: #a52f73;
      --danger: #a6234e;
      --danger-soft: rgba(255, 227, 237, 0.84);
      --success: #116c5f;
      --success-soft: rgba(218, 248, 241, 0.84);
      --focus: #087f79;
      --shadow: 0 28px 80px rgba(43, 32, 80, 0.16);
      --glow-opacity: 0.32;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #090a17;
        --page-deep: #101122;
        --surface: rgba(20, 21, 43, 0.72);
        --surface-strong: rgba(24, 25, 49, 0.93);
        --ink: #f7f6ff;
        --muted: #bebad3;
        --line: rgba(224, 220, 255, 0.16);
        --line-strong: rgba(224, 220, 255, 0.27);
        --violet: #9075f0;
        --teal: #2dd4bf;
        --magenta: #f05b98;
        --amber: #f2b755;
        --button-start: #8466ee;
        --button-end: #db4c91;
        --button-hover-start: #957af5;
        --button-hover-end: #e65ea0;
        --danger: #ffabc5;
        --danger-soft: rgba(91, 24, 48, 0.72);
        --success: #9be8d6;
        --success-soft: rgba(16, 76, 66, 0.64);
        --focus: #61e6d7;
        --shadow: 0 32px 100px rgba(0, 0, 0, 0.44);
        --glow-opacity: 0.5;
      }
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--teal) calc(var(--glow-opacity) * 100%), transparent) 0, transparent 34%),
        radial-gradient(circle at 86% 14%, color-mix(in srgb, var(--magenta) calc(var(--glow-opacity) * 100%), transparent) 0, transparent 31%),
        radial-gradient(circle at 76% 86%, color-mix(in srgb, var(--amber) 24%, transparent) 0, transparent 29%),
        radial-gradient(circle at 18% 86%, color-mix(in srgb, var(--violet) 28%, transparent) 0, transparent 34%),
        linear-gradient(145deg, var(--page), var(--page-deep));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.18;
      background-image: radial-gradient(circle, currentColor 0.55px, transparent 0.75px);
      background-size: 5px 5px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 82%);
    }

    button, input { font: inherit; }

    .motion-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .gradient-blob {
      --blob-opacity: 0.2;
      position: absolute;
      border-radius: 50%;
      opacity: calc(var(--blob-opacity) + var(--proximity-lift, 0));
      filter: blur(42px);
      transform: translate3d(
        calc(var(--parallax-x, 0px) + var(--ambient-x, 0px) + var(--repel-x, 0px)),
        calc(var(--parallax-y, 0px) + var(--ambient-y, 0px) + var(--repel-y, 0px)),
        0
      ) scale(var(--blob-scale, 1));
      transform-origin: center;
      will-change: transform, opacity;
    }

    .gradient-blob.teal {
      top: 5%;
      left: -8%;
      width: clamp(240px, 34vw, 480px);
      aspect-ratio: 1;
      background: var(--teal);
    }

    .gradient-blob.magenta {
      top: -12%;
      right: -7%;
      width: clamp(220px, 31vw, 430px);
      aspect-ratio: 1;
      background: var(--magenta);
    }

    .gradient-blob.amber {
      --blob-opacity: 0.13;
      right: 5%;
      bottom: -16%;
      width: clamp(180px, 27vw, 360px);
      aspect-ratio: 1;
      background: var(--amber);
    }

    .gradient-blob.violet {
      --blob-opacity: 0.16;
      bottom: -13%;
      left: 2%;
      width: clamp(210px, 30vw, 410px);
      aspect-ratio: 1;
      background: var(--violet);
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: center;
      width: min(900px, calc(100% - 36px));
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(54px, 8vw, 92px) 0;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 48% 52% 62% 38% / 44% 38% 62% 56%;
      filter: blur(2px);
      opacity: 0.82;
    }

    .page::before {
      top: 8%;
      right: -14%;
      width: clamp(150px, 25vw, 250px);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--magenta) 38%, transparent);
      background: linear-gradient(145deg, color-mix(in srgb, var(--magenta) 14%, transparent), transparent 60%);
      transform: translate3d(0, 0, 0) rotate(18deg);
      animation: float-shape-a 16s ease-in-out infinite alternate;
      will-change: transform;
    }

    .page::after {
      bottom: 5%;
      left: -17%;
      width: clamp(130px, 21vw, 215px);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--teal) 34%, transparent);
      background: linear-gradient(145deg, color-mix(in srgb, var(--teal) 12%, transparent), transparent 64%);
      transform: translate3d(0, 0, 0) rotate(-24deg);
      animation: float-shape-b 19s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes float-shape-a {
      from { transform: translate3d(-4px, 1px, 0) rotate(16deg); }
      to { transform: translate3d(7px, -10px, 0) rotate(23deg); }
    }

    @keyframes float-shape-b {
      from { transform: translate3d(3px, 4px, 0) rotate(-27deg); }
      to { transform: translate3d(-8px, -7px, 0) rotate(-20deg); }
    }

    .intro {
      max-width: 760px;
      margin: 0 auto 30px;
      text-align: center;
    }

    .context {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .context::before,
    .context::after {
      content: "";
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal));
    }

    .context::after {
      background: linear-gradient(90deg, var(--magenta), transparent);
    }

    h1 {
      margin: 0 auto;
      max-width: 760px;
      font-family: "Libre Baskerville", serif;
      font-size: clamp(2.25rem, 6.6vw, 4.8rem);
      line-height: 1.06;
      letter-spacing: -0.045em;
      color: var(--ink);
      background: linear-gradient(105deg, var(--ink) 14%, var(--violet) 48%, var(--magenta) 78%, var(--ink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 20px auto 0;
      max-width: 610px;
      color: var(--muted);
      font-size: clamp(1rem, 2.1vw, 1.15rem);
      line-height: 1.65;
    }

    .search-card {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --glare-shift-x: 0px;
      --glare-shift-y: 0px;
      --glare-opacity: 0;
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 4.5vw, 40px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(24px) saturate(125%);
      -webkit-backdrop-filter: blur(24px) saturate(125%);
      transform: perspective(1050px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      transform-origin: center;
    }

    .search-card::before {
      content: "";
      position: absolute;
      top: -86px;
      right: -70px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--magenta) 20%, transparent), transparent 68%);
      pointer-events: none;
    }

    .search-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(125deg, color-mix(in srgb, var(--teal) 36%, transparent), transparent 38%, color-mix(in srgb, var(--magenta) 25%, transparent));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card-glare {
      position: absolute;
      top: -42%;
      left: -34%;
      z-index: 0;
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08) 32%, transparent 70%);
      opacity: var(--glare-opacity);
      transform: translate3d(var(--glare-shift-x), var(--glare-shift-y), 0);
      pointer-events: none;
      will-change: transform, opacity;
    }

    form {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 13px;
      align-items: end;
    }

    .field { min-width: 0; }

    label {
      display: block;
      margin: 0 0 10px;
      color: var(--ink);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      min-height: 58px;
      padding: 0 54px 0 18px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      outline: 0;
      background: var(--surface-strong);
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
      opacity: 0.86;
    }

    input:focus {
      border-color: var(--focus);
      background: var(--surface-strong);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 20%, transparent), 0 10px 28px color-mix(in srgb, var(--focus) 12%, transparent);
    }

    .input-tag {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: var(--violet);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      pointer-events: none;
    }

    .primary {
      --magnetic-x: 0px;
      --magnetic-y: 0px;
      --magnetic-scale: 1;
      --press-scale: 1;
      position: relative;
      min-height: 58px;
      padding: 0 25px;
      overflow: hidden;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(118deg, var(--button-start), var(--button-end));
      color: #fff;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--magenta) 23%, transparent);
      font-weight: 700;
      cursor: pointer;
      transform: translate3d(var(--magnetic-x), var(--magnetic-y), 0) scale(calc(var(--magnetic-scale) * var(--press-scale)));
      transition: box-shadow 220ms ease, background 220ms ease;
      will-change: transform;
    }

    .primary::before {
      content: "";
      position: absolute;
      top: -80%;
      left: -44%;
      width: 30%;
      height: 260%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent);
      opacity: 0;
      transform: translate3d(-220%, 0, 0) rotate(18deg);
      pointer-events: none;
    }

    .primary::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 12px;
      background: linear-gradient(120deg, rgba(255,255,255,.2), transparent 38%);
      pointer-events: none;
    }

    .primary:hover {
      background: linear-gradient(118deg, var(--button-hover-start), var(--button-hover-end));
      box-shadow: 0 17px 38px color-mix(in srgb, var(--magenta) 34%, transparent);
    }

    .primary:hover::before {
      opacity: 1;
      transform: translate3d(560%, 0, 0) rotate(18deg);
      transition: transform 720ms cubic-bezier(.22,.61,.36,1), opacity 120ms ease;
    }

    .primary:active { --press-scale: 0.985; }

    .primary:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .hint {
      position: relative;
      z-index: 1;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .destination-note {
      margin-top: 7px;
      color: var(--ink);
      font-weight: 600;
    }

    .privacy-note {
      margin-top: 7px;
      font-size: 0.78rem;
      opacity: 0.82;
    }

    .message,
    .confirmation {
      position: relative;
      z-index: 1;
      display: none;
      margin: 16px 0 0;
      padding: 13px 15px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.5;
    }

    .message {
      background: var(--danger-soft);
      border-color: color-mix(in srgb, var(--danger) 22%, transparent);
      color: var(--danger);
    }

    .confirmation {
      background: var(--success-soft);
      border-color: color-mix(in srgb, var(--success) 22%, transparent);
      color: var(--success);
    }

    .message.visible,
    .confirmation.visible { display: block; }

    .confirmation a {
      color: inherit;
      font-weight: 700;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 22px, 900px);
        align-content: start;
        padding-top: clamp(48px, 14vh, 86px);
      }

      h1 {
        font-size: clamp(2.2rem, 12vw, 3.15rem);
        letter-spacing: -0.04em;
      }

      .intro { margin-bottom: 26px; }
      .subtitle { margin-top: 16px; }
      .search-card { padding: 23px 18px 24px; border-radius: 20px; }
      form { grid-template-columns: 1fr; }
      .primary { width: 100%; }
      .page::before { right: -28%; }
      .page::after { left: -26%; }
    }

    @media (max-width: 380px) {
      .context::before,
      .context::after { width: 18px; }
      .search-card { padding-inline: 15px; }
    }

    @media (hover: hover) and (pointer: fine) {
      .search-card { will-change: transform; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }

      .search-card,
      .gradient-blob,
      .primary { transform: none !important; }

      .card-glare,
      .primary::before { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="motion-field" aria-hidden="true">
    <span class="gradient-blob teal" data-depth="7"></span>
    <span class="gradient-blob magenta" data-depth="11"></span>
    <span class="gradient-blob amber" data-depth="15"></span>
    <span class="gradient-blob violet" data-depth="9"></span>
  </div>
  <main class="page">
    <header class="intro">
      <p class="context">Student records</p>
      <h1>Tezpur University Grade Card</h1>
      <p class="subtitle">Enter your Roll Number / Enrollment ID to view your Grade Card.</p>
    </header>

    <section class="search-card" aria-labelledby="lookup-label">
      <span class="card-glare" aria-hidden="true"></span>
      <form id="gradeCardForm" novalidate>
        <div class="field">
          <label id="lookup-label" for="rollNumber">Roll Number / Enrollment ID</label>
          <div class="input-wrap">
            <input
              id="rollNumber"
              name="rollNumber"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Enter your Roll Number"
              aria-describedby="inputHint destinationNote formMessage confirmationMessage"
              maxlength="28"
            />
            <span class="input-tag" aria-hidden="true">PDF</span>
          </div>
        </div>
        <button class="primary" id="submitButton" type="submit">Get My Grade Card</button>
      </form>
      <p class="hint" id="inputHint">Example: EEB22026. You can type in lowercase; it will be converted automatically.</p>
      <p class="hint destination-note" id="destinationNote">Get My Grade Card opens your PDF directly in a new tab.</p>
      <p class="message" id="formMessage" role="alert"></p>
      <p class="confirmation" id="confirmationMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const baseURL = "http://agnee.tezu.ernet.in:8019/phpcrudajax/student/temFiles/";
      const loggingEndpoint = "https://script.google.com/macros/s/AKfycby2OlgVuds3Am3WzrI8PvQ6CQRCqULAnRJOgg3B4XMSncM9QkD9rmgtHbBJmFu1sKGD/exec";
      const pageLoadTime = Date.now();
      const deviceType = /Mobi|Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "Mobile" : "Desktop";
      const form = document.getElementById("gradeCardForm");
      const rollNumberInput = document.getElementById("rollNumber");
      const formMessage = document.getElementById("formMessage");
      const confirmationMessage = document.getElementById("confirmationMessage");
      const searchCard = document.querySelector(".search-card");
      const submitButton = document.getElementById("submitButton");
      const gradientBlobs = Array.from(document.querySelectorAll(".gradient-blob"));
      const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      const hoverQuery = window.matchMedia("(hover: hover) and (pointer: fine)");

      function createMotionLayer() {
        if (reducedMotionQuery.matches) return function () {};

        const pointerEnabled = hoverQuery.matches;
        const floatProfiles = [
          { x: 13, y: 10, period: 17600, phase: 0.35 },
          { x: 10, y: 14, period: 21100, phase: 2.1 },
          { x: 16, y: 9, period: 23800, phase: 4.25 },
          { x: 11, y: 13, period: 19400, phase: 5.4 }
        ];
        const state = {
          pointerX: 0,
          pointerY: 0,
          pointerTargetX: 0,
          pointerTargetY: 0,
          pointerClientX: window.innerWidth / 2,
          pointerClientY: window.innerHeight / 2,
          pointerActive: false,
          tiltX: 0,
          tiltY: 0,
          tiltTargetX: 0,
          tiltTargetY: 0,
          glareX: 0,
          glareY: 0,
          glareTargetX: 0,
          glareTargetY: 0,
          glareOpacity: 0,
          glareTargetOpacity: 0,
          buttonX: 0,
          buttonY: 0,
          buttonTargetX: 0,
          buttonTargetY: 0,
          buttonScale: 1,
          buttonTargetScale: 1,
          elapsed: 0,
          lastFrameTime: 0
        };
        const blobStates = gradientBlobs.map(function (blob, index) {
          const profile = floatProfiles[index % floatProfiles.length];
          return {
            element: blob,
            depth: Number(blob.dataset.depth) || 8,
            amplitudeX: profile.x,
            amplitudeY: profile.y,
            period: profile.period,
            phase: profile.phase,
            centerX: 0,
            centerY: 0,
            influence: 260,
            repelX: 0,
            repelY: 0,
            scale: 1,
            lift: 0
          };
        });

        let animationFrame = 0;

        function ease(current, target, amount) {
          return current + (target - current) * amount;
        }

        function measureBlobs() {
          blobStates.forEach(function (blobState) {
            const element = blobState.element;
            blobState.centerX = element.offsetLeft + element.offsetWidth / 2;
            blobState.centerY = element.offsetTop + element.offsetHeight / 2;
            blobState.influence = Math.max(element.offsetWidth, element.offsetHeight) * 0.72 + 150;
          });
        }

        function renderMotion(frameTime) {
          animationFrame = 0;
          if (document.hidden) return;

          if (!state.lastFrameTime) state.lastFrameTime = frameTime;
          state.elapsed += Math.min(40, frameTime - state.lastFrameTime);
          state.lastFrameTime = frameTime;

          state.pointerX = ease(state.pointerX, state.pointerTargetX, 0.075);
          state.pointerY = ease(state.pointerY, state.pointerTargetY, 0.075);
          state.tiltX = ease(state.tiltX, state.tiltTargetX, 0.11);
          state.tiltY = ease(state.tiltY, state.tiltTargetY, 0.11);
          state.glareX = ease(state.glareX, state.glareTargetX, 0.1);
          state.glareY = ease(state.glareY, state.glareTargetY, 0.1);
          state.glareOpacity = ease(state.glareOpacity, state.glareTargetOpacity, 0.1);
          state.buttonX = ease(state.buttonX, state.buttonTargetX, 0.16);
          state.buttonY = ease(state.buttonY, state.buttonTargetY, 0.16);
          state.buttonScale = ease(state.buttonScale, state.buttonTargetScale, 0.16);

          if (pointerEnabled) {
            searchCard.style.setProperty("--tilt-x", state.tiltX.toFixed(3) + "deg");
            searchCard.style.setProperty("--tilt-y", state.tiltY.toFixed(3) + "deg");
            searchCard.style.setProperty("--glare-shift-x", state.glareX.toFixed(2) + "px");
            searchCard.style.setProperty("--glare-shift-y", state.glareY.toFixed(2) + "px");
            searchCard.style.setProperty("--glare-opacity", state.glareOpacity.toFixed(3));
            submitButton.style.setProperty("--magnetic-x", state.buttonX.toFixed(2) + "px");
            submitButton.style.setProperty("--magnetic-y", state.buttonY.toFixed(2) + "px");
            submitButton.style.setProperty("--magnetic-scale", state.buttonScale.toFixed(4));
          }

          blobStates.forEach(function (blobState, index) {
            const time = state.elapsed / blobState.period * Math.PI * 2 + blobState.phase;
            const ambientX = Math.sin(time) * blobState.amplitudeX;
            const ambientY = Math.cos(time * 0.83 + blobState.phase * 0.7) * blobState.amplitudeY;
            let targetRepelX = 0;
            let targetRepelY = 0;
            let targetScale = 1;
            let targetLift = 0;

            if (pointerEnabled && state.pointerActive) {
              let deltaX = blobState.centerX - state.pointerClientX;
              let deltaY = blobState.centerY - state.pointerClientY;
              let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
              const proximity = Math.max(0, 1 - distance / blobState.influence);

              if (proximity > 0) {
                if (distance < 1) {
                  deltaX = Math.cos(blobState.phase);
                  deltaY = Math.sin(blobState.phase);
                  distance = 1;
                }
                const easedProximity = proximity * proximity * (3 - 2 * proximity);
                const maxPush = 20 + index * 3;
                targetRepelX = deltaX / distance * maxPush * easedProximity;
                targetRepelY = deltaY / distance * maxPush * easedProximity;
                targetScale = 1 + 0.024 * easedProximity;
                targetLift = 0.045 * easedProximity;
              }
            }

            blobState.repelX = ease(blobState.repelX, targetRepelX, 0.055);
            blobState.repelY = ease(blobState.repelY, targetRepelY, 0.055);
            blobState.scale = ease(blobState.scale, targetScale, 0.06);
            blobState.lift = ease(blobState.lift, targetLift, 0.06);

            blobState.element.style.setProperty("--parallax-x", (-state.pointerX * blobState.depth).toFixed(2) + "px");
            blobState.element.style.setProperty("--parallax-y", (-state.pointerY * blobState.depth).toFixed(2) + "px");
            blobState.element.style.setProperty("--ambient-x", ambientX.toFixed(2) + "px");
            blobState.element.style.setProperty("--ambient-y", ambientY.toFixed(2) + "px");
            blobState.element.style.setProperty("--repel-x", blobState.repelX.toFixed(2) + "px");
            blobState.element.style.setProperty("--repel-y", blobState.repelY.toFixed(2) + "px");
            blobState.element.style.setProperty("--blob-scale", blobState.scale.toFixed(4));
            blobState.element.style.setProperty("--proximity-lift", blobState.lift.toFixed(4));
          });

          animationFrame = window.requestAnimationFrame(renderMotion);
        }

        function startMotion() {
          if (!animationFrame && !document.hidden) {
            animationFrame = window.requestAnimationFrame(renderMotion);
          }
        }

        function handleViewportPointer(event) {
          state.pointerClientX = event.clientX;
          state.pointerClientY = event.clientY;
          state.pointerActive = true;
          state.pointerTargetX = (event.clientX / window.innerWidth - 0.5) * 2;
          state.pointerTargetY = (event.clientY / window.innerHeight - 0.5) * 2;
        }

        function resetViewportMotion() {
          state.pointerActive = false;
          state.pointerTargetX = 0;
          state.pointerTargetY = 0;
        }

        function handleCardPointer(event) {
          const rect = searchCard.getBoundingClientRect();
          const localX = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
          const localY = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
          state.tiltTargetX = -localY * 5.2;
          state.tiltTargetY = localX * 5.8;
          state.glareTargetX = ((localX + 1) / 2) * rect.width * 0.62;
          state.glareTargetY = ((localY + 1) / 2) * rect.height * 0.5;
          state.glareTargetOpacity = 0.72;
        }

        function resetCardMotion() {
          state.tiltTargetX = 0;
          state.tiltTargetY = 0;
          state.glareTargetOpacity = 0;
        }

        function handleButtonPointer(event) {
          const rect = submitButton.getBoundingClientRect();
          const localX = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
          const localY = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
          state.buttonTargetX = localX * 3.5;
          state.buttonTargetY = localY * 2.5;
          state.buttonTargetScale = 1.025;
        }

        function resetButtonMotion() {
          state.buttonTargetX = 0;
          state.buttonTargetY = 0;
          state.buttonTargetScale = 1;
        }

        function handleVisibilityChange() {
          if (document.hidden) {
            if (animationFrame) window.cancelAnimationFrame(animationFrame);
            animationFrame = 0;
            state.lastFrameTime = 0;
          } else {
            measureBlobs();
            startMotion();
          }
        }

        measureBlobs();
        window.addEventListener("resize", measureBlobs, { passive: true });
        document.addEventListener("visibilitychange", handleVisibilityChange);

        if (pointerEnabled) {
          document.addEventListener("pointermove", handleViewportPointer, { passive: true });
          document.documentElement.addEventListener("mouseleave", resetViewportMotion);
          window.addEventListener("blur", resetViewportMotion);
          searchCard.addEventListener("pointermove", handleCardPointer, { passive: true });
          searchCard.addEventListener("pointerleave", resetCardMotion);
          submitButton.addEventListener("pointermove", handleButtonPointer, { passive: true });
          submitButton.addEventListener("pointerenter", handleButtonPointer, { passive: true });
          submitButton.addEventListener("pointerleave", resetButtonMotion);
        }

        startMotion();

        return function destroyMotion() {
          if (animationFrame) window.cancelAnimationFrame(animationFrame);
          window.removeEventListener("resize", measureBlobs);
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          document.removeEventListener("pointermove", handleViewportPointer);
          document.documentElement.removeEventListener("mouseleave", resetViewportMotion);
          window.removeEventListener("blur", resetViewportMotion);
          searchCard.removeEventListener("pointermove", handleCardPointer);
          searchCard.removeEventListener("pointerleave", resetCardMotion);
          submitButton.removeEventListener("pointermove", handleButtonPointer);
          submitButton.removeEventListener("pointerenter", handleButtonPointer);
          submitButton.removeEventListener("pointerleave", resetButtonMotion);
          searchCard.style.removeProperty("--tilt-x");
          searchCard.style.removeProperty("--tilt-y");
          searchCard.style.removeProperty("--glare-shift-x");
          searchCard.style.removeProperty("--glare-shift-y");
          searchCard.style.removeProperty("--glare-opacity");
          submitButton.style.removeProperty("--magnetic-x");
          submitButton.style.removeProperty("--magnetic-y");
          submitButton.style.removeProperty("--magnetic-scale");
          gradientBlobs.forEach(function (blob) {
            blob.style.removeProperty("--parallax-x");
            blob.style.removeProperty("--parallax-y");
            blob.style.removeProperty("--ambient-x");
            blob.style.removeProperty("--ambient-y");
            blob.style.removeProperty("--repel-x");
            blob.style.removeProperty("--repel-y");
            blob.style.removeProperty("--blob-scale");
            blob.style.removeProperty("--proximity-lift");
          });
        };
      }

      let destroyMotion = createMotionLayer();

      function refreshMotionPreference() {
        destroyMotion();
        destroyMotion = createMotionLayer();
      }

      reducedMotionQuery.addEventListener("change", refreshMotionPreference);
      hoverQuery.addEventListener("change", refreshMotionPreference);

      function showMessage(message) {
        confirmationMessage.replaceChildren();
        confirmationMessage.classList.remove("visible");
        formMessage.textContent = message;
        formMessage.classList.add("visible");
      }

      function clearMessages() {
        formMessage.textContent = "";
        formMessage.classList.remove("visible");
        confirmationMessage.replaceChildren();
        confirmationMessage.classList.remove("visible");
      }

      function normalizeRollNumber(value) {
        let normalized = value.trim().toUpperCase();
        if (/\.PDF$/i.test(normalized)) {
          normalized = normalized.slice(0, -4);
        }
        return normalized.trim();
      }

      function isValidRollNumber(value) {
        // Allows common alphanumeric IDs plus a single internal hyphen.
        // Requiring both letters and digits blocks URLs and arbitrary filenames.
        return /^(?=.*[A-Z])(?=.*\d)[A-Z0-9]+(?:-[A-Z0-9]+)?$/.test(value) && value.length >= 4 && value.length <= 24;
      }

      function showConfirmation(fileName, pdfURL) {
        const openingText = document.createTextNode("Opening " + fileName + " in a new tab… ");
        const fallbackLink = document.createElement("a");
        fallbackLink.href = pdfURL;
        fallbackLink.target = "_blank";
        fallbackLink.rel = "noopener noreferrer";
        fallbackLink.textContent = "If it didn't open, click here to open " + fileName + ".";
        confirmationMessage.replaceChildren(openingText, fallbackLink);
        confirmationMessage.classList.add("visible");
      }

      function fetchPublicIP() {
        let timeoutId;

        try {
          const controller = new AbortController();
          timeoutId = window.setTimeout(function () {
            controller.abort();
          }, 2500);

          return fetch("https://api.ipify.org?format=json", { signal: controller.signal })
            .then(function (response) {
              if (!response.ok) throw new Error("IP lookup failed");
              return response.json();
            })
            .then(function (data) {
              return data && typeof data.ip === "string" ? data.ip : "";
            })
            .catch(function () {
              return "";
            })
            .finally(function () {
              window.clearTimeout(timeoutId);
            });
        } catch (error) {
          if (timeoutId) window.clearTimeout(timeoutId);
          return Promise.resolve("");
        }
      }

      const publicIPPromise = fetchPublicIP();

      function postAnalytics(eventName, rollNumber, ipAddress, timeToConversion) {
        try {
          fetch(loggingEndpoint, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              event: eventName,
              roll: rollNumber,
              ua: navigator.userAgent,
              ip: ipAddress,
              device: deviceType,
              referrer: document.referrer,
              ttc: timeToConversion
            })
          }).catch(function () {});
        } catch (error) {
          // Analytics must never interrupt the grade-card lookup.
        }
      }

      publicIPPromise.then(function (ipAddress) {
        postAnalytics("view", "", ipAddress, "");
      });

      function logSubmission(rollNumber) {
        const timeToConversion = Math.round((Date.now() - pageLoadTime) / 1000);
        publicIPPromise.then(function (ipAddress) {
          postAnalytics("submit", rollNumber, ipAddress, timeToConversion);
        });
      }

      function openGradeCard(rawValue) {
        clearMessages();
        const rollNumber = normalizeRollNumber(rawValue);
        rollNumberInput.value = rollNumber;

        if (!rollNumber) {
          showMessage("Please enter your Roll Number / Enrollment ID.");
          rollNumberInput.focus();
          return;
        }

        if (!isValidRollNumber(rollNumber)) {
          showMessage("Please enter a valid Roll Number using letters and numbers only. Do not enter a URL or filename.");
          rollNumberInput.focus();
          return;
        }

        // The fixed university directory is never editable. Only the validated
        // Roll Number is encoded and inserted as the PDF filename.
        const fileName = rollNumber + ".pdf";
        const pdfURL = baseURL + encodeURIComponent(rollNumber) + ".pdf";
        window.open(pdfURL, "_blank", "noopener");
        logSubmission(rollNumber);
        showConfirmation(fileName, pdfURL);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        openGradeCard(rollNumberInput.value);
      });

      rollNumberInput.addEventListener("blur", function () {
        rollNumberInput.value = normalizeRollNumber(rollNumberInput.value);
      });

      rollNumberInput.addEventListener("input", clearMessages);
    })();
  </script>
</body>
</html>
