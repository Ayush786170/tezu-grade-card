<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#7a1f2b" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1416" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <title>Tezpur University Grade Card Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap');

    :root {
      color-scheme: light dark;
      --page: #f4f5f2;
      --surface: #ffffff;
      --surface-muted: #f7f7f4;
      --ink: #1e2521;
      --muted: #59635d;
      --line: #d8ddd8;
      --line-strong: #bfc7c1;
      --brand: #7a1f2b;
      --brand-hover: #651720;
      --brand-soft: #f7e9eb;
      --brand-ink: #681a25;
      --gold: #b8892d;
      --danger: #a22626;
      --danger-soft: #fff0ef;
      --success: #17634f;
      --success-soft: #e8f5f0;
      --focus: #1e6f5c;
      --shadow: 0 16px 42px rgba(28, 40, 33, 0.09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151817;
        --surface: #202422;
        --surface-muted: #272c29;
        --ink: #f0f3ef;
        --muted: #b8c0ba;
        --line: #3a423d;
        --line-strong: #505b54;
        --brand: #d06773;
        --brand-hover: #df7c87;
        --brand-soft: #3b2327;
        --brand-ink: #f3b4bb;
        --gold: #d1aa5b;
        --danger: #ff9a95;
        --danger-soft: #3a2323;
        --success: #8bddc5;
        --success-soft: #1d3931;
        --focus: #79d5bc;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--page); }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, var(--brand) 0 72%, var(--gold) 72% 100%) top / 100% 5px no-repeat,
        var(--page);
    }

    button, input { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(46px, 7vw, 86px) 0 56px;
    }

    .intro {
      max-width: 760px;
      margin-bottom: 28px;
    }

    .context {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 16px;
      color: var(--brand-ink);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .context::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--gold);
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-family: "Libre Baskerville", serif;
      font-size: clamp(2.05rem, 5.2vw, 4.35rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 18px 0 0;
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }

    .search-card {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 38px);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .search-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--brand);
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    .field { min-width: 0; }

    label {
      display: block;
      margin: 0 0 9px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      min-height: 54px;
      padding: 0 50px 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      outline: 0;
      background: var(--surface-muted);
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
      opacity: 0.82;
    }

    input:focus {
      border-color: var(--focus);
      background: var(--surface);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent);
    }

    .input-tag {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      pointer-events: none;
    }

    .primary {
      min-height: 54px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .primary:hover { background: var(--brand-hover); }

    .primary:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 3px;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .destination-note {
      margin-top: 8px;
      font-weight: 600;
    }

    .message,
    .confirmation {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 6px;
      font-weight: 600;
      line-height: 1.5;
    }

    .message {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .confirmation {
      background: var(--success-soft);
      color: var(--success);
    }

    .message.visible,
    .confirmation.visible { display: block; }

    .confirmation a {
      color: inherit;
      font-weight: 700;
      text-underline-offset: 3px;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 22px, 1120px);
        padding-top: 44px;
      }

      h1 { font-size: clamp(2rem, 11vw, 3rem); }
      .search-card { padding: 21px 18px 22px 22px; }
      form { grid-template-columns: 1fr; }
      .primary { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="context">Student records</p>
      <h1>Tezpur University Grade Card</h1>
      <p class="subtitle">Enter your Roll Number / Enrollment ID to view your Grade Card.</p>
    </header>

    <section class="search-card" aria-labelledby="lookup-label">
      <form id="gradeCardForm" novalidate>
        <div class="field">
          <label id="lookup-label" for="rollNumber">Roll Number / Enrollment ID</label>
          <div class="input-wrap">
            <input
              id="rollNumber"
              name="rollNumber"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Enter your Roll Number"
              aria-describedby="inputHint destinationNote formMessage confirmationMessage"
              maxlength="28"
            />
            <span class="input-tag" aria-hidden="true">PDF</span>
          </div>
        </div>
        <button class="primary" id="submitButton" type="submit">Get My Grade Card</button>
      </form>
      <p class="hint" id="inputHint">Example: CEB22054. You can type in lowercase; it will be converted automatically.</p>
      <p class="hint destination-note" id="destinationNote">Get My Grade Card opens your PDF directly in a new tab.</p>
      <p class="message" id="formMessage" role="alert"></p>
      <p class="confirmation" id="confirmationMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const baseURL = "http://agnee.tezu.ernet.in:8019/phpcrudajax/student/temFiles/";
      const form = document.getElementById("gradeCardForm");
      const rollNumberInput = document.getElementById("rollNumber");
      const formMessage = document.getElementById("formMessage");
      const confirmationMessage = document.getElementById("confirmationMessage");

      function showMessage(message) {
        confirmationMessage.replaceChildren();
        confirmationMessage.classList.remove("visible");
        formMessage.textContent = message;
        formMessage.classList.add("visible");
      }

      function clearMessages() {
        formMessage.textContent = "";
        formMessage.classList.remove("visible");
        confirmationMessage.replaceChildren();
        confirmationMessage.classList.remove("visible");
      }

      function normalizeRollNumber(value) {
        let normalized = value.trim().toUpperCase();
        if (/\.PDF$/i.test(normalized)) {
          normalized = normalized.slice(0, -4);
        }
        return normalized.trim();
      }

      function isValidRollNumber(value) {
        // Allows common alphanumeric IDs plus a single internal hyphen.
        // Requiring both letters and digits blocks URLs and arbitrary filenames.
        return /^(?=.*[A-Z])(?=.*\d)[A-Z0-9]+(?:-[A-Z0-9]+)?$/.test(value) && value.length >= 4 && value.length <= 24;
      }

      function showConfirmation(fileName, pdfURL) {
        const openingText = document.createTextNode("Opening " + fileName + " in a new tab… ");
        const fallbackLink = document.createElement("a");
        fallbackLink.href = pdfURL;
        fallbackLink.target = "_blank";
        fallbackLink.rel = "noopener noreferrer";
        fallbackLink.textContent = "If it didn't open, click here to open " + fileName + ".";
        confirmationMessage.replaceChildren(openingText, fallbackLink);
        confirmationMessage.classList.add("visible");
      }

      function openGradeCard(rawValue) {
        clearMessages();
        const rollNumber = normalizeRollNumber(rawValue);
        rollNumberInput.value = rollNumber;

        if (!rollNumber) {
          showMessage("Please enter your Roll Number / Enrollment ID.");
          rollNumberInput.focus();
          return;
        }

        if (!isValidRollNumber(rollNumber)) {
          showMessage("Please enter a valid Roll Number using letters and numbers only. Do not enter a URL or filename.");
          rollNumberInput.focus();
          return;
        }

        // The fixed university directory is never editable. Only the validated
        // Roll Number is encoded and inserted as the PDF filename.
        const fileName = rollNumber + ".pdf";
        const pdfURL = baseURL + encodeURIComponent(rollNumber) + ".pdf";
        window.open(pdfURL, "_blank", "noopener");
        showConfirmation(fileName, pdfURL);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        openGradeCard(rollNumberInput.value);
      });

      rollNumberInput.addEventListener("blur", function () {
        rollNumberInput.value = normalizeRollNumber(rollNumberInput.value);
      });

      rollNumberInput.addEventListener("input", clearMessages);
    })();
  </script>
</body>
</html>
